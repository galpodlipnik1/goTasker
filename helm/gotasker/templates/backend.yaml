apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotasker-data
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotasker
  namespace: {{ .Values.global.namespace }}
  labels:
    app: gotasker
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gotasker
  template:
    metadata:
      labels:
        app: gotasker
    spec:
      containers:
      - name: gotasker
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.backend.service.port }}
        env:
        - name: APP_ADDR
          value: ":{{ .Values.backend.service.port }}"
        - name: SQLITE_PATH
          value: "/var/lib/gotasker/tasks.db"
        - name: REDIS_ADDR
          value: "redis:6379"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: gotasker-data
          mountPath: /var/lib/gotasker
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.backend.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.backend.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: gotasker-data
        persistentVolumeClaim:
          claimName: gotasker-data
---
apiVersion: v1
kind: Service
metadata:
  name: gotasker
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: gotasker
  ports:
    - protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
