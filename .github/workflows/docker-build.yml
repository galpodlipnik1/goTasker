name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "deploy/Dockerfile"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Deploy to VPS via Teleport
        if: github.event_name == 'push'
        env:
          TELEPORT_PASSWORD: ${{ secrets.TELEPORT_PASSWORD }}
          GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
        run: |
          # Install Teleport
          curl https://cdn.teleport.dev/install-connect.sh | bash -s 18.6.2

          # Login to Teleport
          echo "$TELEPORT_PASSWORD" | tsh login --proxy=devops.lrk.si --user=aradovan --password-file=/dev/stdin

          # Deploy via tsh
          tsh ssh "aradovan@devops-sk-12" << 'EOF'
          cd goTasker
          git pull origin master
          docker login ghcr.io -u ${{ github.actor }} -p $GIT_HUB_TOKEN
          docker compose -f deploy/docker-compose.yaml down
          docker compose -f deploy/docker-compose.yaml up -d --pull=always
          EOF

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            README.md
