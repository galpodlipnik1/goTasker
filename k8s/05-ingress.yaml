apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotasker-ingress
  namespace: gotasker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - devops.radovan.si
    secretName: gotasker-tls
  rules:
  - host: devops.radovan.si
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
