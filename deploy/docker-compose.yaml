services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - "--log.level=DEBUG"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=radovan.aljaz@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--api=true"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_letsencrypt:/letsencrypt
    networks:
      - gotasker-network

  app:
    image: ghcr.io/galpodlipnik1/gotasker:latest
    environment:
      - APP_ADDR=:8081
      - SQLITE_PATH=/var/lib/gotasker/tasks.db
      - REDIS_ADDR=redis:6379
      - LOG_LEVEL=info
    volumes:
      - gotasker_data:/var/lib/gotasker
    depends_on:
      - redis
    networks:
      - gotasker-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gotasker-redis
    volumes:
      - redis_data:/data
    networks:
      - gotasker-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: gotasker-nginx
    volumes:
      - ./nginx/docker-default:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - gotasker-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotasker.rule=Host(`devops.radovan.si`)"
      - "traefik.http.routers.gotasker.entrypoints=web,websecure"
      - "traefik.http.routers.gotasker.service=nginx"
      - "traefik.http.routers.gotasker.tls=true"
      - "traefik.http.routers.gotasker.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gotasker-http.rule=Host(`devops.radovan.si`)"
      - "traefik.http.routers.gotasker-http.entrypoints=web"
      - "traefik.http.routers.gotasker-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: gotasker-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - gotasker-network
    restart: unless-stopped

volumes:
  gotasker_data:
  redis_data:
  prometheus_data:
  traefik_letsencrypt:

networks:
  gotasker-network:
    driver: bridge
